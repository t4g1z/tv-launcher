name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip files and find the project
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then unzip -o "$f"; fi
          done
          FOUND=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            ls -R | head -n 60
            exit 1
          fi
          echo "PROJECT_ROOT=$(dirname "$FOUND")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
